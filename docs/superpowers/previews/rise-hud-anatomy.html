<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Rise Overlay · 怪物本体可视化 · 6 版风格</title>
<style>
  :root{
    --page-bg:#080B10; --page-card:#111721; --page-line:#1D2633;
    --ink:#E6EDF5; --ink-2:#9AA3B2; --ink-3:#66707E;
    --panel-bg:rgba(9,13,20,.955); --panel-border:#262C36;
    --fg:#FFFFFF; --fg-muted:#9AA3B2;
    --track:#161D26; --hp:#D94B43; --brk:#FF8C42;
    --ok:#97C459; --warn:#EF9F27; --bad:#F09595;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--page-bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:44px 28px 80px}
  h1{font-size:22px;font-weight:500;margin:0 0 10px}
  .sub{font-size:13px;color:var(--ink-2);line-height:1.8;margin:0 0 8px;max-width:940px}
  .sub b{color:var(--ink);font-weight:500}
  .kicker{font-size:12px;color:var(--ink-3);line-height:1.75;margin:0 0 30px;max-width:940px;
    border-left:2px solid #2A3340;padding-left:14px}

  .gallery{display:flex;flex-wrap:wrap;gap:36px 30px;align-items:flex-start}
  .cell{width:300px}
  .idx{font-size:11px;color:var(--ink-3);letter-spacing:1px;margin-bottom:3px}
  .lname{font-size:13px;font-weight:500;margin-bottom:2px}
  .ldesc{font-size:11.5px;color:var(--ink-2);line-height:1.6;margin-bottom:9px;min-height:52px}
  .lmeta{font-size:10.5px;color:var(--ink-3);line-height:1.65;margin-top:7px}
  .lmeta b{color:var(--ink-2);font-weight:500}

  .hud{width:300px;border-radius:6px;padding:6px 8px;font-size:11px;color:var(--fg);
    overflow:hidden;border:1px solid var(--panel-border)}
  .mname{font-size:12px;font-weight:500;margin-bottom:3px}
  .hp-row{display:flex;align-items:center;gap:6px}
  .hp-track{flex:1;height:8px;background:var(--track);border-radius:1px;overflow:hidden}
  .hp-fill{height:100%;border-radius:1px}
  .hp-text{font-size:9px;color:var(--fg-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .srow{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0 7px}
  .schip{display:flex;align-items:center;gap:3px;padding:1px 4px;border-radius:2px;background:rgba(255,255,255,.045)}
  .schip em{width:2px;height:9px;border-radius:1px;display:block;font-style:normal}
  .schip span{font-size:9px;color:var(--fg-muted)}
  .schip b{font-size:9px;font-weight:500;color:var(--fg)}
  .ptitle{font-size:9px;color:var(--fg-muted);margin-bottom:3px}
  .arow{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
  .achip{display:flex;align-items:center;gap:3px;padding:1px 4px;border-radius:2px;background:rgba(255,255,255,.045)}
  .achip em{width:2px;height:9px;border-radius:1px;display:block;font-style:normal}
  .achip span{font-size:9px;color:var(--fg-muted)}
  .achip b{font-size:9px;font-weight:500;color:var(--fg)}
  .legend{margin-top:4px;font-size:9px;color:var(--fg-muted);line-height:1.6;
    font-variant-numeric:tabular-nums}
  .legend .sep{color:#3A434F;margin:0 3px}
  .legend .gone{color:#5C6673;text-decoration:line-through}

  .ruler{position:relative;height:16px;width:300px;margin-bottom:6px}
  .ruler::before,.ruler::after{content:"";position:absolute;top:6px;width:1px;height:8px;background:var(--ink-3)}
  .ruler::before{left:0}.ruler::after{right:0}
  .ruler i{position:absolute;left:0;right:0;top:9px;height:1px;background:var(--page-line)}
  .ruler span{position:absolute;left:50%;transform:translateX(-50%);top:-4px;font-size:10px;
    color:var(--ink-3);background:var(--page-bg);padding:0 6px}

  .verdict{background:var(--page-card);border:.5px solid var(--page-line);border-radius:8px;
    padding:16px 18px;font-size:12.5px;line-height:1.85;color:var(--ink-2);margin-top:46px}
  .verdict b{color:var(--ink);font-weight:500}
  .verdict h3{font-size:13px;font-weight:500;color:var(--ink);margin:0 0 8px}
  .verdict table{border-collapse:collapse;font-size:11.5px;margin-top:10px;width:100%}
  .verdict th,.verdict td{text-align:left;padding:5px 10px 5px 0;
    border-bottom:1px solid var(--page-line);font-weight:400;color:var(--ink-2);vertical-align:top}
  .verdict th{color:var(--ink-3);font-size:11px;font-weight:500}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important} }
</style>
</head>
<body>
<script>
window.__ERRS__ = [];
window.addEventListener('error', function (e) {
  var t = e.target;
  if (t && t.tagName === 'SCRIPT') { window.__ERRS__.push('script-load-fail: ' + t.src); return; }
  var st = e.error && e.error.stack ? e.error.stack.split('\n').slice(0,6).join(' | ') : '(no stack)';
  window.__ERRS__.push(e.message + ' @' + (e.filename||'').slice(-28) + ':' + e.lineno + ' :: ' + st);
}, true);
</script>

<div class="wrap">
  <h1>怪物本体可视化 · 6 版</h1>
  <p class="sub">上一轮那 12 版是<b>信息架构排列</b>——把 5 个部位摆成轨、网格、环、柱、条，换的是排队方式。这一轮换的是<b>表达媒介</b>：<b>不再用列表表示部位，直接把怪物画出来。</b></p>
  <p class="kicker">部位不再是「第 3 行」，而是怪物身上的一块地方。玩家一眼看到的是「这只怪身上哪儿在掉血、哪儿该打」，而不是「读一行字」。<br>
  六版共用同一套解剖剪影（嗟怨震天怨虎龙侧面），只换视觉语言 —— 这才是「想象」和「排版」的区别。</p>

  <div class="gallery" id="gallery"></div>

  <div class="verdict" id="verdict">测算中…</div>
</div>

<pre id="__diag__" style="display:none"></pre>

<script>
var SCHIPS = [
  {l:'愤怒', v:'0:14', c:'#FF8C42'}, {l:'晕眩', v:'88%', c:'#EAB308'},
  {l:'耐力', v:'62%', c:'#4A9B9B'}, {l:'御龙', v:'62%', c:'#C9AA62'}
];
var AILS = [
  {l:'毒', v:'42%', c:'#E11D48'}, {l:'麻', v:'生效', c:'#EAB308'},
  {l:'眠', v:'15%', c:'#4F87A6'}, {l:'爆', v:'67%', c:'#FF8C42'},
  {l:'减气', v:'8%', c:'#4A9B9B'}
];

var PARTS = [
  {name:'头部', hp:620,  max:1200, broken:false, sever:false, qurio:false},
  {name:'前肢', hp:0,    max:900,  broken:true,  sever:false, qurio:false},
  {name:'腹部', hp:1100, max:1500, broken:false, sever:false, qurio:false},
  {name:'尾巴', hp:280,  max:800,  broken:false, sever:true,  qurio:false},
  {name:'背鳍', hp:450,  max:700,  broken:false, sever:false, qurio:false}
];
function P(n){ for(var i=0;i<PARTS.length;i++) if(PARTS[i].name===n) return PARTS[i]; }
function t(n){ var p=P(n); return p.broken ? 0 : p.hp / p.max; }
function pi(n){ return Math.round(t(n)*100); }

/* 解剖剪影：画布 280x120，朝左的四足飞龙。
   轮廓是**一条连续 path**（保证可辨识：角 / 双背刃 / 长尾 / 四足），
   部位区域是矩形，被轮廓 clip 成有机形状 —— 而不是拿椭圆三角拼贴。 */
var BODY_PATH =
  'M12,64 C14,56 22,52 32,50 C40,48 46,40 52,24 C56,40 62,46 72,48 '+
  'C80,46 86,42 94,40 L106,14 L114,38 L128,18 L142,40 '+
  'C158,44 172,48 186,54 C206,58 240,58 268,54 '+
  'C246,64 210,68 188,70 C182,74 178,80 176,88 L174,108 L160,108 L158,82 '+
  'C148,86 138,88 128,86 C120,86 114,86 108,88 L104,108 L90,108 L88,84 '+
  'C80,80 72,76 64,72 C50,74 34,76 22,72 C16,70 12,68 12,64 Z';

var REGIONS = {
  '尾巴': {x:178, y:48, w:98, h:26},
  '腹部': {x:74,  y:40, w:110, h:48},
  '头部': {x:8,   y:40, w:68,  h:40},
  '背鳍': {x:90,  y:10, w:54,  h:36},
  '前肢': {x:86,  y:83, w:26,  h:29}
};
var DRAW_ORDER = ['尾巴','腹部','头部','背鳍','前肢'];

function regionMarkup(name, attrs){
  var r = REGIONS[name];
  return '<rect x="'+r.x+'" y="'+r.y+'" width="'+r.w+'" height="'+r.h+'" '+(attrs||'')+'/>';
}

/* 前肢已断：在轮廓内叠一道裂纹 */
function cracks(name, uid){
  if(name !== '前肢') return '';
  return '<g clip-path="url(#body-'+uid+')">'+
    '<path d="M97,79 L101,89 L95,95 L100,105" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.1"/>'+
    '<path d="M107,83 L104,93 L109,101" fill="none" stroke="rgba(255,255,255,.36)" stroke-width="1"/>'+
  '</g>';
}

/* ---------- 六套视觉语言 ---------- */
var THEMES = {
  anatomy: {
    id:'01', key:'ANATOMY', name:'ANATOMY · 解剖剪影',
    desc:'最克制的一版。深色面板 + 部位按血量亮度着红，像生物课本的解剖图。',
    meta:'纯 XAML 可做 · 五个 <Path>/<Ellipse> + DataTrigger 控色',
    hud:{ bg:'rgba(9,13,20,.955)', border:'#262C36', hpFrom:'#8E2F2B', hpTo:'#D94B43' },
    outline: '#8A3A34',
    part: function(n, uid){
      var k = t(n), p = P(n);
      if(p.broken) return { fill:'url(#hatch-'+uid+')', stroke:'#4A535F' };
      return { fill:'hsl(8,62%,'+(17+32*k).toFixed(1)+'%)',
               stroke:'hsl(8,55%,'+(30+28*k).toFixed(1)+'%)' };
    },
    overlay: function(){ return ''; }
  },
  xray: {
    id:'02', key:'X-RAY', name:'X-RAY · X 光透视',
    desc:'医学影像语言。青色半透明填充 + 双层描边模拟辉光，暗底像阅片灯箱。',
    meta:'需双层描边（外层低透明宽线）· 纯 XAML 可做',
    hud:{ bg:'rgba(4,14,20,.96)', border:'#1B3A44', hpFrom:'#0E5E6E', hpTo:'#4ADEDE' },
    outline: 'rgba(74,222,222,.72)',
    part: function(n, uid){
      var k = t(n), p = P(n);
      if(p.broken) return { fill:'url(#hatch-'+uid+')', stroke:'rgba(74,222,222,.30)' };
      return { fill:'rgba(74,222,222,'+(0.07+0.24*k).toFixed(2)+')', stroke:'rgba(74,222,222,'+(0.45+0.5*k).toFixed(2)+')' };
    },
    overlay: function(uid){
      return '<g opacity=".5">'+
        '<path d="M0,20 H280 M0,44 H280 M0,68 H280 M0,92 H280" stroke="rgba(74,222,222,.18)" stroke-width=".6"/>'+
      '</g>';
    }
  },
  holo: {
    id:'03', key:'HOLOGRAM', name:'HOLOGRAM · 全息投影',
    desc:'科幻全息语言。扫描线铺满剪影，轮廓外发光，像从投影仪里浮出来的三维模型。',
    meta:'需 <Pattern> 扫描线 + 外发光描边 · 建议硬件渲染',
    hud:{ bg:'rgba(6,16,32,.96)', border:'#1E3A5C', hpFrom:'#1B5FA8', hpTo:'#5AC8FA' },
    outline: 'rgba(140,225,255,.85)',
    part: function(n, uid){
      var k = t(n), p = P(n);
      if(p.broken) return { fill:'url(#hatch-'+uid+')', stroke:'rgba(90,200,250,.28)' };
      return { fill:'rgba(90,200,250,'+(0.10+0.26*k).toFixed(2)+')', stroke:'rgba(140,225,255,'+(0.5+0.45*k).toFixed(2)+')' };
    },
    overlay: function(uid){
      return '<g>'+
        '<rect x="0" y="0" width="280" height="110" fill="url(#scan-'+uid+')" opacity=".85"/>'+
      '</g>'+
      '<g opacity=".28">'+
        '<path d="M0,30 H280 M0,62 H280 M0,94 H280" stroke="#8CE1FF" stroke-width="1"/>'+
      '</g>';
    }
  },
  notes: {
    id:'04', key:'HUNTER NOTES', name:'HUNTER NOTES · 猎人笔记',
    desc:'怪物猎人世界观语言。暖棕墨线 + 手绘虚线轮廓，像从猎人手册上撕下来的一页。',
    meta:'虚线描边 + 暖色填充 · 纯 XAML 可做',
    hud:{ bg:'rgba(28,22,14,.955)', border:'#4A3C26', hpFrom:'#8A5A22', hpTo:'#C8A050' },
    outline: 'rgba(226,192,120,.75)',
    part: function(n, uid){
      var k = t(n), p = P(n);
      if(p.broken) return { fill:'url(#hatch-'+uid+')', stroke:'rgba(200,160,80,.32)' };
      return { fill:'rgba(200,160,80,'+(0.08+0.26*k).toFixed(2)+')', stroke:'rgba(226,192,120,'+(0.45+0.45*k).toFixed(2)+')', dash:'2 3' };
    },
    overlay: function(uid){
      return '<g opacity=".14">'+
        '<path d="M0,14 H280 M0,38 H280 M0,62 H280 M0,86 H280 M0,104 H280" stroke="#E2C078" stroke-width=".7"/>'+
      '</g>';
    }
  },
  qurio: {
    id:'05', key:'QURIO VEINS', name:'QURIO VEINS · 怪异化脉络',
    desc:'怪异化主题语言。暗紫底 + 红色结晶脉络贯穿剪影，血量越低脉络越亮，像被侵蚀。',
    meta:'需 <Path> 脉络线 + 按血量控不透明度 · 纯 XAML 可做',
    hud:{ bg:'rgba(20,8,18,.96)', border:'#4A1E38', hpFrom:'#7A1030', hpTo:'#FF2E63' },
    outline: 'rgba(255,90,140,.80)',
    part: function(n, uid){
      var k = t(n), p = P(n);
      if(p.broken) return { fill:'url(#hatch-'+uid+')', stroke:'rgba(255,46,99,.28)' };
      return { fill:'rgba(255,46,99,'+(0.08+0.30*k).toFixed(2)+')', stroke:'rgba(255,90,140,'+(0.45+0.5*k).toFixed(2)+')' };
    },
    overlay: function(uid){
      return '<g opacity=".55">'+
        '<path d="M40,52 Q70,44 100,56 Q130,68 160,54 Q196,40 240,44" fill="none" stroke="#FF5A8C" stroke-width="1.1"/>'+
        '<path d="M52,60 Q80,72 112,64 M120,48 Q150,58 180,48" fill="none" stroke="#FF5A8C" stroke-width=".8" opacity=".7"/>'+
        '<path d="M150,70 Q190,64 228,52" fill="none" stroke="#FF5A8C" stroke-width=".8" opacity=".6"/>'+
      '</g>';
    }
  },
  wire: {
    id:'06', key:'WIREFRAME', name:'WIREFRAME · 线框模型',
    desc:'最轻量的一版。完全不填充，只画轮廓线，部位靠线条亮度和粗细区分。不挡游戏画面。',
    meta:'零填充 · 纯 XAML 可做 · 最不遮挡视野',
    hud:{ bg:'rgba(8,11,16,.72)', border:'rgba(60,70,84,.6)', hpFrom:'#8E2F2B', hpTo:'#D94B43' },
    outline: 'rgba(255,255,255,.55)',
    part: function(n, uid){
      var k = t(n), p = P(n);
      if(p.broken) return { fill:'url(#hatch-'+uid+')', stroke:'rgba(150,162,178,.34)' };
      return { fill:'none', stroke:'rgba(255,255,255,'+(0.28+0.62*k).toFixed(2)+')', w:(0.9+1.5*k).toFixed(2) };
    },
    overlay: function(){ return ''; }
  }
};

function dragonSVG(th, uid){
  var defs = '<defs><clipPath id="body-'+uid+'"><path d="'+BODY_PATH+'"/></clipPath>'+
    '<pattern id="hatch-'+uid+'" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'+
    '<rect width="5" height="5" fill="rgba(255,255,255,.03)"/>'+
    '<line x1="0" y1="0" x2="0" y2="5" stroke="rgba(255,255,255,.20)" stroke-width="1.4"/></pattern>';
  if(th.key === 'HOLOGRAM'){
    defs += '<pattern id="scan-'+uid+'" width="3" height="3" patternUnits="userSpaceOnUse">'+
      '<rect width="3" height="1.4" fill="rgba(140,225,255,.17)"/></pattern>';
  }
  defs += '</defs>';

  var base = '<path d="'+BODY_PATH+'" fill="rgba(255,255,255,.04)"/>';

  var regions = DRAW_ORDER.map(function(n){
    var st = th.part(n, uid);
    var a = 'fill="'+st.fill+'" stroke="'+st.stroke+'" stroke-width="'+(st.w||1.1)+'"';
    if(st.dash) a += ' stroke-dasharray="'+st.dash+'"';
    return regionMarkup(n, a);
  }).join('');

  var ov = th.overlay ? th.overlay(uid) : '';
  var outline = '<path d="'+BODY_PATH+'" fill="none" stroke="'+th.outline+
    '" stroke-width="1.3" stroke-linejoin="round"/>';

  return '<svg width="100%" viewBox="0 0 280 120" style="display:block">' +
    defs + base +
    '<g clip-path="url(#body-'+uid+')">' + regions + '</g>' +
    '<g clip-path="url(#body-'+uid+')">' + cracks('前肢', uid) + '</g>' +
    (ov ? '<g clip-path="url(#body-'+uid+')">' + ov + '</g>' : '') +
    outline +
  '</svg>';
}

function legendHTML(){
  return '<div class="legend">' + PARTS.map(function(p){
    if(p.broken) return '<span class="gone">'+p.name+' 已断</span>';
    return '<span>'+p.name+' '+pi(p.name)+'%</span>';
  }).join('<span class="sep">·</span>') + '</div>';
}

function hud(theme, uid){
  return '<div class="mname">嗟怨震天怨虎龙</div>'+
    '<div class="hp-row"><div class="hp-track">'+
      '<div class="hp-fill" style="width:19.7%;background:linear-gradient(90deg,'+theme.hud.hpFrom+','+theme.hud.hpTo+')"></div>'+
    '</div><div class="hp-text">4820 / 24500</div></div>'+
    '<div class="srow">' + SCHIPS.map(function(c){
      return '<span class="schip"><em style="background:'+c.c+'"></em><span>'+c.l+'</span><b>'+c.v+'</b></span>';
    }).join('') + '</div>'+
    '<div class="ptitle">部位解剖图 · 填充 = 剩余血量</div>'+
    dragonSVG(theme, uid) + legendHTML() +
    '<div class="arow">' + AILS.map(function(a){
      return '<span class="achip"><em style="background:'+a.c+'"></em><span>'+a.l+'</span><b>'+a.v+'</b></span>';
    }).join('') + '</div>';
}

function build(){
  var g = document.getElementById('gallery');
  if(!g) return;
  var keys = ['anatomy','xray','holo','notes','qurio','wire'];
  g.innerHTML = keys.map(function(k, i){
    var th = THEMES[k];
    var uid = 'u' + i;
    return '<div class="cell">'+
      '<div class="idx">'+th.id+'</div>'+
      '<div class="lname">'+th.name+'</div>'+
      '<div class="ldesc">'+th.desc+'</div>'+
      '<div class="ruler"><i></i><span>300px</span></div>'+
      '<div class="hud" id="hud-'+uid+'" style="background:'+th.hud.bg+';border-color:'+th.hud.border+'">'+
        hud(th, uid) +
      '</div>'+
      '<div class="lmeta">'+th.meta+'</div>'+
    '</div>';
  }).join('');
}

function verdict(){
  var v = document.getElementById('verdict');
  if(!v) return;
  var rows = '', ids = ['u0','u1','u2','u3','u4','u5'];
  var keys = ['anatomy','xray','holo','notes','qurio','wire'];
  ids.forEach(function(id, i){
    var el = document.getElementById('hud-'+id);
    if(!el) return;
    rows += '<tr><td>'+THEMES[keys[i]].id+' '+THEMES[keys[i]].key+'</td>'+
      '<td>'+el.getBoundingClientRect().height.toFixed(0)+'px</td>'+
      '<td>'+(el.scrollWidth - el.clientWidth)+'px</td>'+
      '<td>'+Math.round(el.getBoundingClientRect().width)+'px</td></tr>';
  });
  v.innerHTML = '<h3>实测（无头 Chrome，1180 视口）</h3>'+
    '<table><tr><th>版本</th><th>卡片总高</th><th>横向溢出</th><th>宽度</th></tr>'+rows+'</table>'+
    '<p style="margin:14px 0 0"><b>六版共用同一套解剖剪影</b>（头部 / 前肢 / 腹部 / 尾巴 / 背鳍 五个独立形状），'+
    '换的只是填充与描边语言。剪影本身可辨识、方位正确 —— 这是「本体可视化」和「排版」的分水岭。</p>'+
    '<p style="margin:10px 0 0"><b>与现行版的关系</b>：这不是替换关系，是<b>新增一层</b>。'+
    '现有文字行可以整体保留在剪影下方，剪影负责「空间锚定」，文字负责「精确数值」。'+
    '也可以把文字行折叠掉，只留剪影 + 一行图例（见每版底部那行）。</p>';
}

window.__DIAG__ = function(){
  var ids = ['hud-u0','hud-u1','hud-u2','hud-u3','hud-u4','hud-u5'];
  var bad = [], cards = {};
  ids.forEach(function(id){
    var el = document.getElementById(id);
    if(!el){ bad.push(id+':missing'); return; }
    var over = el.scrollWidth - el.clientWidth;
    var w = el.getBoundingClientRect().width;
    if(over > 1) bad.push(id+':overflow'+over);
    if(Math.round(w) !== 300) bad.push(id+':width'+w);
    cards[id] = 'w'+Math.round(w)+' h'+Math.round(el.getBoundingClientRect().height)+' over'+over;
  });
  var svgCount = document.querySelectorAll('.hud svg').length;
  var docOver = document.documentElement.scrollWidth - document.documentElement.clientWidth;
  var errs = (window.__ERRS__ || []).length;
  return { ok: bad.length === 0 && errs === 0, bad: bad, cards: cards,
    svgCount: svgCount, docOverflowX: docOver, errors: window.__ERRS__ };
};

build();
verdict();
try {
  var dg = document.getElementById('__diag__');
  if(dg) dg.textContent = JSON.stringify(window.__DIAG__());
} catch (e) {
  var dg2 = document.getElementById('__diag__');
  if(dg2) dg2.textContent = 'DIAG_FAIL: ' + e.message;
}
</script>
</body>
